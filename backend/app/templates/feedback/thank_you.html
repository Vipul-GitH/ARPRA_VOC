<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ campaign.thank_you_title or "Thank You" }} | Dr Bhasin's Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root { --brand: #08333a; --text: #0f172a; }
        body {
            font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(120% 120% at 20% 0%, rgba(59, 130, 246, 0.12), transparent 45%),
                radial-gradient(120% 140% at 80% 20%, rgba(16, 185, 129, 0.12), transparent 55%),
                linear-gradient(180deg, #f8fafc, #eef2f7);
            color: var(--text);
        }
        h1 {
            font-family: "Fraunces", "Georgia", serif;
            color: #0f172a;
        }
        .thank-card {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.1);
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
        }
        .halo {
            position: absolute;
            inset: -40% 20% auto 20%;
            height: 240px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.25), transparent 70%);
            filter: blur(40px);
            z-index: 0;
        }
        .cta {
            background: var(--brand);
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(8, 51, 58, 0.2);
        }
        .fade-in {
            animation: fadeInUp 0.5s ease both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-[var(--text)]">
    <div class="relative max-w-lg w-full px-4">
        <div class="halo"></div>
        <div class="thank-card p-8 rounded-2xl text-center space-y-4 fade-in relative z-10">
        {% if campaign.thank_you_image_url %}
            <div class="flex justify-center">
                <img src="{{ campaign.thank_you_image_url }}" alt="Thank you" class="max-h-48 rounded-xl shadow">
            </div>
        {% endif %}
        <h1 class="text-3xl font-bold">{{ campaign.thank_you_title or "Thank you for your feedback!" }}</h1>
        <p class="text-gray-700">
            {{ campaign.thank_you_message or "Your response was submitted successfully. Our team will review and act on your feedback promptly." }}
        </p>
        <p class="text-sm text-gray-500">Campaign: {{ campaign.name }}</p>
        </div>
    </div>
</body>
</html>
