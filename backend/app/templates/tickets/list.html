{% extends 'base.html' %}
{% block content %}
<div class="card p-4 space-y-3">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-xs uppercase tracking-wide text-[var(--primary,#054e5d)] font-semibold">Tickets</p>
            <h2 class="text-xl font-bold">Customer issues</h2>
        </div>
    </div>
    <table class="w-full bg-white rounded shadow text-sm border border-gray-200">
        <thead class="bg-gray-50"><tr><th class="text-left p-2">Number</th><th class="text-left p-2">Campaign</th><th class="p-2">Status</th><th class="p-2">Severity</th><th class="p-2">Action</th></tr></thead>
        <tbody>
        {% for t in tickets %}
            <tr class="border-t">
                <td class="p-2">{{ t.ticket_number }}</td>
                <td class="p-2">{{ t.campaign.name if t.campaign else '' }}</td>
                <td class="p-2"><span class="px-2 py-1 rounded-full text-xs bg-gray-100 text-gray-700">{{ t.status }}</span></td>
                <td class="p-2"><span class="px-2 py-1 rounded-full text-xs bg-amber-50 text-amber-700">{{ t.severity }}</span></td>
                <td class="p-2 text-right"><a href="/tickets/{{ t.id }}" class="text-[var(--primary,#054e5d)] font-semibold">Open</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
